version: "0.2"
name: devops-readonly
culture_file: ../CULTURE.md
summary: >
  Read-only DevOps investigation rig. The orchestrator routes a question to the
  specialist that owns the domain and consolidates one report. Every seat here
  is strictly read-only, so this rig is safe to run before the mutation gates
  are hook-enforced.

  Seats that mutate — terraform-engineer, delivery-engineer, helm-engineer —
  and seats that mutate behind a gate — argocd-analyst, kargo-promoter — are
  deliberately absent. Their gates are currently prose in the agent's own
  Boundaries section, and a managed seat runs with acceptEdits and a pre-trusted
  workspace, which does not honour prose. They join once the gates are hooks.

pods:
  - id: orch
    label: Orchestration
    members:
      - id: lead
        agent_ref: "local:../../openrig/agents/ops-lead"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: runtime
    label: Live systems
    members:
      - id: k8s
        agent_ref: "local:../../openrig/agents/kubernetes-investigator"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: cloud
    label: Cloud
    members:
      - id: investigator
        agent_ref: "local:../../openrig/agents/aws-investigator"
        runtime: codex
        profile: default
        cwd: "."
      - id: cost
        agent_ref: "local:../../openrig/agents/aws-cost-analyzer"
        runtime: claude-code
        profile: default
        cwd: "."
    edges:
      # "the database is slow" vs "the database is expensive" — same resource,
      # different question. Cost may read the investigator's findings.
      - kind: can_observe
        from: cost
        to: investigator

  - id: observability
    label: Observability
    members:
      - id: newrelic
        agent_ref: "local:../../openrig/agents/newrelic-analyst"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: code
    label: Code navigation
    members:
      - id: navigator
        agent_ref: "local:../../openrig/agents/codegraph-navigator"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

# Edges are generated by three rules from standards/handoff-contract.md:
#   delegates_to  the orchestrator dispatches every routing-table agent
#   can_observe   a read-only question, peer to peer, ONE hop
#   escalates_to  out-of-domain work returns upward, it does not chain sideways
#
# There is deliberately NO delegates_to between specialists. "Writes never
# chain" is the whole loop-prevention design, and here it is the absence of an
# edge rather than a paragraph an agent may skip.
edges:
  - {kind: delegates_to, from: orch.lead, to: runtime.k8s}
  - {kind: delegates_to, from: orch.lead, to: cloud.investigator}
  - {kind: delegates_to, from: orch.lead, to: cloud.cost}
  - {kind: delegates_to, from: orch.lead, to: observability.newrelic}
  - {kind: delegates_to, from: orch.lead, to: code.navigator}

  # Peer consults that the routing table's disambiguation rules imply.
  # "why is <service> slow" starts at the monitoring verdict, which names the
  # service whose pod evidence explains it.
  - {kind: can_observe, from: observability.newrelic, to: runtime.k8s}
  # "node count / autoscaling" is read from the cluster; capacity questions
  # continue into the cloud account.
  - {kind: can_observe, from: runtime.k8s, to: cloud.investigator}

  - {kind: escalates_to, from: runtime.k8s,            to: orch.lead}
  - {kind: escalates_to, from: cloud.investigator,     to: orch.lead}
  - {kind: escalates_to, from: cloud.cost,             to: orch.lead}
  - {kind: escalates_to, from: observability.newrelic, to: orch.lead}
  - {kind: escalates_to, from: code.navigator,         to: orch.lead}

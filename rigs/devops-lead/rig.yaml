version: "0.2"
name: devops-lead
culture_file: CULTURE.md
summary: >
  The orchestrator alone. Grow the specialists a task actually needs instead of
  booting the whole roster.

  Cheaper to start and easier to watch, at the cost of the thing seats are for:
  a grown seat begins with no accrued context, so work that returns to the same
  specialist repeatedly is better served by devops-readonly or devops-full.

  Add a seat to the running rig:

    rig grow <rig-id> k8s   --new-pod runtime --cwd <path>
    rig grow <rig-id> tf    --new-pod iac     --cwd <path>
    rig terminal open devops-lead

  `rig ps` gives the rig id. The lead can run these itself only if you granted
  agents permission to run rig commands during `rig setup`; otherwise you grow
  the seats by hand.

pods:
  - id: orch
    label: Orchestration
    members:
      - id: lead
        agent_ref: "local:../../openrig/agents/ops-lead"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

# No edges: every specialist arrives later via `rig grow`. Note that OpenRig
# 0.6.2 does not materialise spec edges into runtime state anyway - see
# openrig/README.md. The handoff rules are carried by CULTURE.md and by each
# agent's own Boundaries.
edges: []
